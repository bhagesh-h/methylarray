repository_type: pipeline

nf_core_version: 4.2.2

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-methylarray_logo_light.png
    - docs/images/nf-core-methylarray_logo_light.png
    - docs/images/nf-core-methylarray_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - assets/email_template.html
    - docs/README.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-methylarray_logo_light.png
    - docs/images/nf-core-methylarray_logo_light.png
    - docs/images/nf-core-methylarray_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - conf/igenomes.config
    - conf/igenomes_ignored.config

template:
  org: bhagesh-h
  name: methylarray
  description: Quality control, preprocessing and association analysis of Illumina
    Infinium DNA methylation arrays (EPIC v2)
  author: bhagesh-h
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - igenomes
    - fastqc
    - gpu
  is_nfcore: false
