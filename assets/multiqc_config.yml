report_comment: >
  This report has been generated by the <a href="https://github.com/bhagesh-h/methylarray/tree/dev" target="_blank">bhagesh-h/methylarray</a>
  analysis pipeline.
# Sections follow the pipeline: sample QC, probe filtering, cell composition,
# clocks and scores, exploratory analysis, association models; the methods
# description and software versions come last.
report_section_order:
