    order: 1000
  sample_qc_sex:
    order: 990
  probe_attrition:
    order: 980
  cell_fractions:
    order: 970
  clock_coverage:
    order: 960
  dnam_scores_coverage:
    order: 950
  pca_scree:
    order: 940
  pca_scatter:
    order: 930
  pca_associations:
    order: 920
  ewas_summary:
    order: 910
  "bhagesh-h-methylarray-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "bhagesh-h-methylarray-summary":
    order: -1002

export_plots: true

disable_version_detection: true
