  <h4>Methods</h4>
  <p>Data were processed with bhagesh-h/methylarray v${workflow.manifest.version} ${doi_text}, built with the nf-core template (<a href="https://doi.org/10.1038/s41587-020-0439-x">Ewels <em>et al.</em>, 2020</a>), with pinned software from Bioconda (<a href="https://doi.org/10.1038/s41592-018-0046-7">Grüning <em>et al.</em>, 2018</a>) and conda-forge.</p>
  <p>The pipeline was executed with Nextflow v${workflow.nextflow.version} (<a href="https://doi.org/10.1038/nbt.3820">Di Tommaso <em>et al.</em>, 2017</a>) with the following command:</p>
  <pre style="white-space: pre-wrap; overflow-wrap: anywhere;"><code>${command_text}</code></pre>
  <p>The steps of the analysis:</p>
  ${tool_citations}
  <h4>References</h4>
  <ul>
    <li>Di Tommaso, P., et al. (2017). Nextflow enables reproducible computational workflows. <em>Nature Biotechnology</em>, 35(4), 316-319. <a href="https://doi.org/10.1038/nbt.3820">https://doi.org/10.1038/nbt.3820</a></li>
    <li>Ewels, P. A., et al. (2020). The nf-core framework for community-curated bioinformatics pipelines. <em>Nature Biotechnology</em>, 38(3), 276-278. <a href="https://doi.org/10.1038/s41587-020-0439-x">https://doi.org/10.1038/s41587-020-0439-x</a></li>
    <li>Grüning, B., et al. (2018). Bioconda: sustainable and comprehensive software distribution for the life sciences. <em>Nature Methods</em>, 15(7), 475-476. <a href="https://doi.org/10.1038/s41592-018-0046-7">https://doi.org/10.1038/s41592-018-0046-7</a></li>
    ${tool_bibliography}
  </ul>
  <div class="alert alert-info">
    <h5>Notes:</h5>
