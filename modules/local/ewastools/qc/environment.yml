# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
# ewastools itself is not on conda or CRAN: the module installs its staged source
# (a pinned GitHub commit) into the task directory. These are its dependencies.
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::bioconductor-illuminaio=0.52.0
  - conda-forge::procps-ng=4.0.6
  - conda-forge::r-base=4.5.3
  - conda-forge::r-data.table=1.18.6.1
  - conda-forge::r-ff=4.5.3
  - conda-forge::r-forcats=1.0.1
  - conda-forge::r-igraph=2.3.4
  - conda-forge::r-jsonlite=2.0.0
  - conda-forge::r-mblm=0.12.1
  - conda-forge::r-quadprog=1.5_8
  - conda-forge::r-stringr=1.6.0
  - conda-forge::r-tibble=3.3.1
