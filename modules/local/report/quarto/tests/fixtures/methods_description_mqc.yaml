data: |
  <h4>Methods</h4>
  <p>Data was processed using bhagesh-h/methylarray v1.0.0dev , built with the nf-core template (<a href="https://doi.org/10.1038/s41587-020-0439-x">Ewels <em>et al.</em>, 2020</a>), with pinned software from Bioconda (<a href="https://doi.org/10.1038/s41592-018-0046-7">Grüning <em>et al.</em>, 2018</a>) and conda-forge.</p>
  <p>The pipeline was executed with Nextflow v26.10.6 (<a href="https://doi.org/10.1038/nbt.3820">Di Tommaso <em>et al.</em>, 2017</a>) with the following command:</p>
  <pre><code>nextflow run /pipeline/methylarray -profile test,docker --outdir /data/methylarray/results/minfi -w /data/methylarray/work -resume</code></pre>
  <p>Arrays were read with minfi (Aryee et al. 2014; Fortin et al. 2017) and preprocessed with Noob background and dye-bias correction (Triche et al. 2013); values with a detection p-value above 0.05 or fewer than 3 beads were set to missing. Control-probe metrics, normalised X and Y intensities and SNP probe genotypes were computed with ewastools (Heiss and Just 2018). Arrays with more than 10.0% undetected probes, a predicted sex that contradicted the reported sex or a SNP outlier score above -4 failed quality control; arrays with control metrics below Illumina's thresholds or genotype conflicts with the expected donors were flagged. Probes were annotated with the extended EPIC v2 manifest (Peters et al. 2024) and the InfiniumAnnotation masks (Zhou et al. 2017). The following were removed: non-CG and genotyping probes; probes without an hg38 position; probes on the sex chromosomes; probes that failed detection in more than 10% or other masks in more than 5% of arrays; probes with a SNP (global minor allele frequency of at least 1%) in the probe body, at the CpG or at the extension base; probes in the general mask of Zhou et al. (2017); cross-hybridising probes with WGBS evidence of off-target binding (Peters et al. 2024). Replicate probes were averaged per CpG. Association tests use M-values. Leukocyte fractions were estimated with EpiDISH robust partial correlations (Teschendorff et al. 2017) using the 12-cell-type reference of Luo et al. (2023). Epigenetic clocks were computed with dnaMethyAge (Wang et al. 2024) and DunedinPACE (Belsky et al. 2022) on the detection-masked beta values averaged per CpG; values that failed detection were set to the CpG mean over the other arrays. DNA methylation scores for smoking, alcohol and BMI (McCartney et al. 2018) and IL-6 (Stevenson et al. 2021) were computed as weighted sums of the published CpG sets. Technical variation was summarised with principal components of the control-probe intensities (Lehne et al. 2015), and the principal components of the most variable CpGs were tested for association with technical and biological variables, their number estimated by random matrix theory (isva, Teschendorff et al. 2011).    Results were summarised with MultiQC (Ewels et al. 2016).</p>
  <h4>References</h4>
  <ul>
    <li>Di Tommaso, P., Chatzou, M., Floden, E. W., Barja, P. P., Palumbo, E., & Notredame, C. (2017). Nextflow enables reproducible computational workflows. Nature Biotechnology, 35(4), 316-319. doi: <a href="https://doi.org/10.1038/nbt.3820">10.1038/nbt.3820</a></li>
    <li>Ewels, P. A., Peltzer, A., Fillinger, S., Patel, H., Alneberg, J., Wilm, A., Garcia, M. U., Di Tommaso, P., & Nahnsen, S. (2020). The nf-core framework for community-curated bioinformatics pipelines. Nature Biotechnology, 38(3), 276-278. doi: <a href="https://doi.org/10.1038/s41587-020-0439-x">10.1038/s41587-020-0439-x</a></li>
    <li>Grüning, B., Dale, R., Sjödin, A., Chapman, B. A., Rowe, J., Tomkins-Tinch, C. H., Valieris, R., Köster, J., & Bioconda Team. (2018). Bioconda: sustainable and comprehensive software distribution for the life sciences. Nature Methods, 15(7), 475–476. doi: <a href="https://doi.org/10.1038/s41592-018-0046-7">10.1038/s41592-018-0046-7</a></li>
    <li>Aryee, M. J., Jaffe, A. E., Corrada-Bravo, H., et al. (2014). Minfi: a flexible and comprehensive Bioconductor package for the analysis of Infinium DNA methylation microarrays. Bioinformatics, 30(10), 1363-1369. doi: <a href="https://doi.org/10.1093/bioinformatics/btu049">10.1093/bioinformatics/btu049</a></li> <li>Fortin, J. P., Triche, T. J., & Hansen, K. D. (2017). Preprocessing, normalization and integration of the Illumina HumanMethylationEPIC array with minfi. Bioinformatics, 33(4), 558-560. doi: <a href="https://doi.org/10.1093/bioinformatics/btw691">10.1093/bioinformatics/btw691</a></li> <li>Triche, T. J., Weisenberger, D. J., Van Den Berg, D., Laird, P. W., & Siegmund, K. D. (2013). Low-level processing of Illumina Infinium DNA Methylation BeadArrays. Nucleic Acids Research, 41(7), e90. doi: <a href="https://doi.org/10.1093/nar/gkt090">10.1093/nar/gkt090</a></li> <li>Heiss, J. A., & Just, A. C. (2018). Identifying mislabeled and contaminated DNA methylation microarray data: an extended quality control toolset with examples from GEO. Clinical Epigenetics, 10, 73. doi: <a href="https://doi.org/10.1186/s13148-018-0504-1">10.1186/s13148-018-0504-1</a></li> <li>Peters, T. J., Meyer, B., Ryan, L., et al. (2024). Characterisation and reproducibility of the HumanMethylationEPIC v2.0 BeadChip for DNA methylation profiling. BMC Genomics, 25, 251. doi: <a href="https://doi.org/10.1186/s12864-024-10027-5">10.1186/s12864-024-10027-5</a></li> <li>Zhou, W., Laird, P. W., & Shen, H. (2017). Comprehensive characterization, annotation and innovative use of Infinium DNA methylation BeadChip probes. Nucleic Acids Research, 45(4), e22. doi: <a href="https://doi.org/10.1093/nar/gkw967">10.1093/nar/gkw967</a></li> <li>Teschendorff, A. E., Breeze, C. E., Zheng, S. C., & Beck, S. (2017). A comparison of reference-based algorithms for correcting cell-type heterogeneity in Epigenome-Wide Association Studies. BMC Bioinformatics, 18, 105. doi: <a href="https://doi.org/10.1186/s12859-017-1511-5">10.1186/s12859-017-1511-5</a></li> <li>Luo, Q., Dwaraka, V. B., Chen, Q., et al. (2023). A meta-analysis of immune-cell fractions at high resolution reveals novel associations with common phenotypes and health outcomes. Genome Medicine, 15, 59. doi: <a href="https://doi.org/10.1186/s13073-023-01211-5">10.1186/s13073-023-01211-5</a></li> <li>Wang, Y., Grant, O. A., Zhai, X., McDonald-Maier, K. D., & Schalkwyk, L. C. (2024). Insights into ageing rates comparison across tissues from recalibrating cerebellum DNA methylation clock. GeroScience, 46, 39-56. doi: <a href="https://doi.org/10.1007/s11357-023-00871-w">10.1007/s11357-023-00871-w</a></li> <li>Belsky, D. W., Caspi, A., Corcoran, D. L., et al. (2022). DunedinPACE, a DNA methylation biomarker of the pace of aging. eLife, 11, e73420. doi: <a href="https://doi.org/10.7554/eLife.73420">10.7554/eLife.73420</a></li> <li>McCartney, D. L., Hillary, R. F., Stevenson, A. J., et al. (2018). Epigenetic prediction of complex traits and death. Genome Biology, 19, 136. doi: <a href="https://doi.org/10.1186/s13059-018-1514-1">10.1186/s13059-018-1514-1</a></li> <li>Stevenson, A. J., Gadd, D. A., Hillary, R. F., et al. (2021). Creating and validating a DNA methylation-based proxy for interleukin-6. The Journals of Gerontology: Series A, 76(12), 2284-2292. doi: <a href="https://doi.org/10.1093/gerona/glab046">10.1093/gerona/glab046</a></li> <li>Lehne, B., Drong, A. W., Loh, M., et al. (2015). A coherent approach for analysis of the Illumina HumanMethylation450 BeadChip improves data quality and performance in epigenome-wide association studies. Genome Biology, 16, 37. doi: <a href="https://doi.org/10.1186/s13059-015-0600-x">10.1186/s13059-015-0600-x</a></li> <li>Teschendorff, A. E., Zhuang, J., & Widschwendter, M. (2011). Independent surrogate variable analysis to deconvolve confounding factors in large-scale microarray profiling studies. Bioinformatics, 27(11), 1496-1505. doi: <a href="https://doi.org/10.1093/bioinformatics/btr171">10.1093/bioinformatics/btr171</a></li> <li>Ewels, P., Magnusson, M., Lundin, S., & Käller, M. (2016). MultiQC: summarize analysis results for multiple tools and samples in a single report. Bioinformatics, 32(19), 3047-3048. doi: <a href="https://doi.org/10.1093/bioinformatics/btw354">10.1093/bioinformatics/btw354</a></li>
  </ul>
