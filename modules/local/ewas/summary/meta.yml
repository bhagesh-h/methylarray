name: ewas_summary
description: One table across the association models (N, lambda, bacon inflation and bias, hits per threshold, top CpG) and a MultiQC table
keywords:
  - dna methylation
  - ewas
  - summary
tools:
  - jsonlite:
      description: "JSON parser and generator for R"
      homepage: https://cran.r-project.org/package=jsonlite
      documentation: https://cran.r-project.org/package=jsonlite
      licence: ["MIT"]
      identifier: ""
input:
  - summaries:
      type: file
      description: Per-model summaries from EWAS_LIMMA
      pattern: "*_summary.json"
      ontologies:
        - edam: http://edamontology.org/format_3464
  - stats:
      type: file
      description: Per-model statistics from EWAS_LIMMA, for the study-wide threshold and the meQTL overlap
      pattern: "*_stats.tsv.gz"
      ontologies:
        - edam: http://edamontology.org/format_3475
  - meqtl_cpgs:
      type: file
      description: CpGs with a cis-meQTL from MEQTL_PREPARE, or []
      pattern: "*.tsv"
      ontologies:
        - edam: http://edamontology.org/format_3475
output:
  meqtl:
    - "${prefix}_meqtl.tsv":
        type: file
        description: Hits with a cis-meQTL per model and contrast, with Fisher's exact test (header only without a meQTL list)
        pattern: "*_meqtl.tsv"
        ontologies:
          - edam: http://edamontology.org/format_3475
  summary:
    - "${prefix}.tsv":
        type: file
        description: One row per model and contrast
        pattern: "*.tsv"
        ontologies:
          - edam: http://edamontology.org/format_3475
  cells:
    - "${prefix}_cells.tsv":
        type: file
        description: Cell-type-specific hits per model and lineage (header only when no model ran the cell-type analysis)
        pattern: "*_cells.tsv"
        ontologies:
          - edam: http://edamontology.org/format_3475
  multiqc:
    - "${prefix}*_mqc.tsv":
        type: file
        description: MultiQC tables of the models and of the cell-type-specific hits
        pattern: "*_mqc.tsv"
        ontologies:
          - edam: http://edamontology.org/format_3475
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750
authors:
  - "@bhagesh-h"
maintainers:
  - "@bhagesh-h"
