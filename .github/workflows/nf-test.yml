name: Run nf-test
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/meta.yml"
      - "**/*.md"
      - "**/*.png"
      - "**/*.svg"
  release:
    types: [published]
  workflow_dispatch:

# Cancel if a newer run is started
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Pull requests into dev run only the tests tagged "fast" (stubs, fixtures,
  # input validation); the real-data tests run for main, releases and manual runs
  NFT_TAGS: ${{ (github.event_name == 'pull_request' && github.base_ref != 'main' && github.base_ref != 'master') && 'fast' || '' }}
  NFT_VER: "0.9.4"
  NFT_WORKDIR: "~"
  NXF_ANSI_LOG: false
  # A remote input file that stops sending data fails after five minutes
  # instead of holding the job until the runner's time limit
  NXF_OPTS: "-Dsun.net.client.defaultConnectTimeout=60000 -Dsun.net.client.defaultReadTimeout=300000"

jobs:
  nf-test-changes:
    name: nf-test-changes
    runs-on: # use GitHub runners
      - "ubuntu-latest"
    outputs:
      shard: ${{ steps.set-shards.outputs.shard }}
      total_shards: ${{ steps.set-shards.outputs.total_shards }}
    steps:
      - name: Clean Workspace # Purge the workspace in case it's running on a self-hosted runner
        run: |
          ls -la ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          ls -la ./
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: get number of shards
        id: set-shards
        uses: ./.github/actions/get-shards
        env:
          NFT_VER: ${{ env.NFT_VER }}
        with:
          max_shards: 10
          tags: ${{ env.NFT_TAGS }}

      - name: debug
        run: |
          echo ${{ steps.set-shards.outputs.shard }}
          echo ${{ steps.set-shards.outputs.total_shards }}

      # The tests read public GEO IDATs over HTTPS. NCBI refuses part of the
      # requests when many test jobs fetch them at once, so this job fetches
      # each file once (cached between runs) and passes them to the test jobs.
      - name: Restore the GEO test IDATs
        if: ${{ steps.set-shards.outputs.total_shards != '0' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/geo-idats
          key: geo-idats-${{ hashFiles('tests/data/samplesheet_test.csv') }}
          restore-keys: geo-idats-

      # NCBI sometimes answers the HTTPS file server with 403 for a whole runner,
      # so each file is tried from three NCBI routes (HTTPS, FTP and the GEO
      # download page), in up to three rounds a minute apart
      - name: Download the GEO test IDATs
        if: ${{ steps.set-shards.outputs.total_shards != '0' }}
        run: |
          prefix="https://ftp.ncbi.nlm.nih.gov/geo/samples/"
          grep -hoE 'https://ftp\.ncbi\.nlm\.nih\.gov/geo/samples/[^ ,"]+\.idat\.gz' tests/data/samplesheet_test.csv | sort -u > geo-urls.txt
          fetch() { curl -fsSL --retry 2 --retry-all-errors --retry-delay 10 --connect-timeout 30 --max-time 300 -o "$2" "$1" && gzip -t "$2"; }
          while read -r url; do
            path="${url#"$prefix"}"
            dest="${RUNNER_TEMP}/geo-idats/${path}"
            if [ -s "$dest" ] && gzip -t "$dest"; then continue; fi
            mkdir -p "$(dirname "$dest")"
            file="$(basename "$path")"
            sources=("$url" "ftp://ftp.ncbi.nlm.nih.gov/geo/samples/${path}" "https://www.ncbi.nlm.nih.gov/geo/download/?acc=${file%%_*}&format=file&file=${file}")
            done_file=""
            for round in 1 2 3; do
              for source in "${sources[@]}"; do
                if fetch "$source" "$dest"; then done_file=1; break 2; fi
                echo "::warning::Round ${round}: download failed from ${source%%\?*}"
              done
              sleep 60
            done
            if [ -z "$done_file" ]; then echo "::error::Could not download ${file} from NCBI"; exit 1; fi
          done < geo-urls.txt
          echo "$(wc -l < geo-urls.txt) GEO IDAT files ready"

      - name: Share the GEO test IDATs with the test jobs
        if: ${{ steps.set-shards.outputs.total_shards != '0' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: geo-idats
          path: ${{ runner.temp }}/geo-idats
          retention-days: 1

  nf-test:
    name: "${{ matrix.profile }} | ${{ matrix.NXF_VER }} | ${{ matrix.shard }}/${{ needs.nf-test-changes.outputs.total_shards }}"
    needs: [nf-test-changes]
    if: ${{ needs.nf-test-changes.outputs.total_shards != '0' }}
    runs-on: # use GitHub runners
      - "ubuntu-latest"
    # Every test job finishes within 30 minutes; a stalled image pull or
    # download fails the job instead of running until the 6 hour limit
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.nf-test-changes.outputs.shard) }}
        # Docker only: conda and Singularity jobs took longer than 30 minutes
        # (environment builds and image conversion). Check those engines
        # locally with dev/nfdev --engine conda or --engine apptainer.
        profile: [docker]
        isMain:
          - ${{ github.base_ref == 'master' || github.base_ref == 'main' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
        # PRs into dev: the minimum Nextflow version only. The latest Nextflow
        # runs for main, releases and manual runs.
        exclude:
          - isMain: false
            NXF_VER: "latest-everything"
        NXF_VER:
          - "26.04.2"
          - "latest-everything"
    env:
      NXF_ANSI_LOG: false
      TOTAL_SHARDS: ${{ needs.nf-test-changes.outputs.total_shards }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Get the GEO test IDATs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: geo-idats
          path: ${{ runner.temp }}/geo-idats

      # Point the samplesheet and module tests at the local copies; file names
      # stay the same, so the snapshots do not change
      - name: Use the local GEO test IDATs
        run: |
          git grep -lF "https://ftp.ncbi.nlm.nih.gov/geo/samples/" -- tests/data/samplesheet_test.csv 'modules/local/**/tests/main.nf.test' \
            | xargs sed -i "s#https://ftp.ncbi.nlm.nih.gov/geo/samples/#${RUNNER_TEMP}/geo-idats/#g"
          git status --short

      - name: Run nf-test
        id: run_nf_test
        uses: ./.github/actions/nf-test
        # Shorter than the job limit, so that a slow latest-everything shard
        # stays a warning and the summary steps still run
        timeout-minutes: 25
        continue-on-error: ${{ matrix.NXF_VER == 'latest-everything' }}
        env:
          NFT_WORKDIR: ${{ env.NFT_WORKDIR }}
          NXF_VERSION: ${{ matrix.NXF_VER }}
        with:
          profile: ${{ matrix.profile }}
          shard: ${{ matrix.shard }}
          total_shards: ${{ env.TOTAL_SHARDS }}
          tags: ${{ env.NFT_TAGS }}

      - name: Report test status
        if: ${{ always() }}
        run: |
          if [[ "${{ steps.run_nf_test.outcome }}" == "failure" ]]; then
            echo "::error::Test with ${{ matrix.NXF_VER }} failed"
            # Add to workflow summary
            echo "## ❌ Test failed: ${{ matrix.profile }} | ${{ matrix.NXF_VER }} | Shard ${{ matrix.shard }}/${{ env.TOTAL_SHARDS }}" >> $GITHUB_STEP_SUMMARY
            if [[ "${{ matrix.NXF_VER }}" == "latest-everything" ]]; then
              echo "::warning::Test with latest-everything failed but will not cause workflow failure. Please check if the error is expected or if it needs fixing."
            fi
            if [[ "${{ matrix.NXF_VER }}" != "latest-everything" ]]; then
              exit 1
            fi
          fi

      # continue-on-error keeps latest-everything from failing the job, so it never shows up in
      # `needs.nf-test.result` downstream and CI stays green. Surface it via a PR comment instead;
      # other NXF_VER failures already fail the job/CI directly, so no comment is needed for those.
      - name: Prepare PR comment fragment
        if: ${{ always() && steps.run_nf_test.outcome == 'failure' && matrix.NXF_VER == 'latest-everything' }}
        run: |
          mkdir -p pr-comment-fragment
          echo "* ❌ \`${{ matrix.profile }}\` | \`${{ matrix.NXF_VER }}\` | Shard ${{ matrix.shard }}/${{ env.TOTAL_SHARDS }}" > pr-comment-fragment/fragment.md

      - name: Upload PR comment fragment
        if: ${{ always() && steps.run_nf_test.outcome == 'failure' && matrix.NXF_VER == 'latest-everything' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-comment-fragment-${{ strategy.job-index }}
          path: pr-comment-fragment/

  confirm-pass:
    needs: [nf-test]
    if: always()
    runs-on: # use GitHub runners
      - "ubuntu-latest"
    steps:
      - name: One or more tests failed (excluding latest-everything)
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: One or more tests cancelled
        if: ${{ contains(needs.*.result, 'cancelled') }}
        run: exit 1

      - name: All tests ok
        if: ${{ contains(needs.*.result, 'success') }}
        run: exit 0

      - name: debug-print
        if: always()
        run: |
          echo "::group::DEBUG: `needs` Contents"
          echo "DEBUG: toJSON(needs) = ${{ toJSON(needs) }}"
          echo "DEBUG: toJSON(needs.*.result) = ${{ toJSON(needs.*.result) }}"
          echo "::endgroup::"

      - name: Download PR comment fragments
        if: ${{ always() }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: pr-comment-fragment-*
          path: pr-comment-fragments
          merge-multiple: true

      # Build a comment for the shared pr-comment.yml poster to publish on the PR.
      # Based on the fragments above (not needs.*.result) so non-blocking failures are still reported.
      - name: Prepare PR comment
        if: ${{ always() }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p pr-comment
          echo "$PR_NUMBER" > pr-comment/pr_number.txt
          echo "nf-test" > pr-comment/header.txt
          if [ -d pr-comment-fragments ] && [ -n "$(ls -A pr-comment-fragments)" ]; then
            {
              echo "## ❌ nf-test failed with latest Nextflow version"
              echo ""
              echo "> [!NOTE]"
              echo "> Tests with Nextflow's latest version failed but it will not cause a CI workflow failure."
              echo "> Please check if the failure is expected with newer (edge-)releases of Nextflow or if it needs fixing."
              echo ""
              cat pr-comment-fragments/*.md
              echo ""
              echo "See the [full run](${RUN_URL}) for details."
            } > pr-comment/comment.md
          fi

      - name: Upload PR comment artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pr-comment
          path: pr-comment/
